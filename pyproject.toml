[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wyoming-chatterbox"
version = "0.1.0"
description = "Wyoming protocol TTS server for Resemble AI Chatterbox"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "wyoming-chatterbox contributors" }]
keywords = ["wyoming", "tts", "chatterbox", "home-assistant"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    "wyoming>=1.5.4",
    "pydantic-settings>=2.0",
    "numpy>=1.24",
]

[project.optional-dependencies]
torch = ["torch>=2.0"]
chatterbox = ["chatterbox-tts"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.0",
    "ruff>=0.5",
    "pyright>=1.1",
    "anyio>=4.0",
]

[project.scripts]
wyoming-chatterbox = "wyoming_chatterbox.__main__:main"

[project.urls]
Homepage = "https://github.com/wyoming-chatterbox/wyoming-chatterbox"
Repository = "https://github.com/wyoming-chatterbox/wyoming-chatterbox"

[tool.hatch.build.targets.wheel]
packages = ["src/wyoming_chatterbox"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "C4"]
ignore = ["B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra"

[tool.pyright]
include = ["src"]
pythonVersion = "3.11"
reportMissingImports = false
